#
# This is an NGINX server configuration block.
# It defines how the server should handle incoming traffic for a specific port and domain.
#
server {
    # The 'listen' directive specifies the port on which the server will accept incoming connections.
    # In this case, it listens on TCP port 3000 for both IPv4 and IPv6.
    listen 3000;

    #
    # The 'location' block defines how NGINX will process requests for specific URI patterns.
    # The '/' prefix means this block will handle any request URI that starts with a forward slash,
    # effectively acting as the default handler for all requests if no more specific location matches.
    #
    location / {
        # The 'root' directive specifies the base directory from which NGINX should look for files.
        # NGINX will append the request URI to this path to find the file to serve.
        root /usr/share/nginx/html;

        # The 'index' directive defines the default files to try serving when a request is made
        # for a directory (e.g., http://example.com/). NGINX will look for the first file
        # that exists in the specified order.
        index index.html index.htm;

        # The 'try_files' directive checks for the existence of files and directories in the specified order
        # and serves the first one found. If none are found, it performs an internal redirect to the last
        # specified URI or returns a status code.
        # 1. Tries to find a file matching the exact URI ($uri).
        # 2. Tries to find a directory matching the URI ($uri/).
        # 3. If neither is found, it internally redirects the request to '/index.html',
        #    which allows a single-page application (SPA) or a specific error page to handle the request.
        try_files $uri $uri/ /index.html;
    }
}
