# ==================================================================================== #
#                                 -- AWS ELB Deployment --                             #
# ==================================================================================== #

# 1. --  Environment Configuration -- #
language: generic             # Use "generic" language for Docker-based builds (allows full control over the environment).
sudo: required                # Request root privileges for Docker service access.
services:                     # Start the Docker daemon.
  - docker

# 2. --  Build the Docker image before running tests -- #
before_install:
  - docker build -t ayfantis53/react-test -f ./client/Dockerfile.dev ./client

# 3. --  Run tests within the Docker container -- #
script:
  - docker run -e CI=true ayfantis53/react-test npm test

# 4. --  Actions to perform only if the test script succeeds -- #
after_success: 
  # Build Images.
  - docker build -t ayfantis53/mern-goalsetter-client ./client
  - docker build -t ayfantis53/mern-goalsetter-nginx ./nginx
  - docker build -t ayfantis53/mern-goalsetter-server ./server
  # Login to docker CLI.
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_ID" --password-stdin
  # Push Built images to DockerHub.
  - docker push ayfantis53/mern-goalsetter-client 
  - docker push ayfantis53/mern-goalsetter-nginx
  - docker push ayfantis53/mern-goalsetter-server 

# 5. --  Deployment configuration for Elastic BeanStalk -- #
deploy:
  provider: elasticbeanstalk
  region: "us-east-2"
  app: "goalsetter"
  env: "goalsetter-env"
  bucket_name: "elasticbeanstalk-us-east-2-770468062645"
  bucket_path: "goalsetter"
  on:
    branch: master
  access_key_id: $AWS_ACCESS_KEY
  secret_access_key: "$AWS_SECRET_KEY"
  edge: true

